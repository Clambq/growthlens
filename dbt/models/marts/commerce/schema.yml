version: 2

models:
  - name: fct_orders
    description: One row per order with child relations pre-aggregated before joining.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: merchandise_value
        description: Sum of item price at order grain; freight is excluded.
        data_tests: [not_null]
      - name: payment_value
        description: Sum of payment records at order grain; not labeled as GMV.
        data_tests: [not_null]

  - name: fct_order_items
    description: One row per order item.
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

  - name: dim_customers
    description: One row per stable person-level Olist customer identifier.
    columns:
      - name: customer_unique_id
        data_tests: [not_null, unique]

  - name: dim_products
    columns:
      - name: product_id
        data_tests: [not_null, unique]

  - name: dim_sellers
    columns:
      - name: seller_id
        data_tests: [not_null, unique]

  - name: dim_dates
    columns:
      - name: date_day
        data_tests: [not_null, unique]

  - name: mart_daily_kpis
    description: Daily commercial-order KPIs keyed by purchase date.
    columns:
      - name: metric_date
        data_tests: [not_null, unique]
      - name: orders
        data_tests: [not_null]

  - name: mart_kpi_alerts
    description: SQL-native diagnostic alerts; production portfolio alerts use Python median/MAD.
    columns:
      - name: metric_date
        data_tests: [not_null]
      - name: metric
        data_tests: [not_null]

  - name: mart_customer_cohorts
    columns:
      - name: customer_unique_id
        data_tests: [not_null]
      - name: month_offset
        data_tests: [not_null]

  - name: mart_customer_rfm
    description: Fixed, documented RFM boundaries evaluated at the latest observed order date.
    columns:
      - name: customer_unique_id
        data_tests: [not_null, unique]

  - name: mart_seller_scorecard
    description: Seller triage score; priority ranking requires at least three commercial orders.
    columns:
      - name: seller_id
        data_tests: [not_null, unique]

  - name: mart_delivery_diagnostics
    description: Delivery timing and review-score associations; not a causal effect estimate.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: interpretation_label
        data_tests:
          - accepted_values:
              arguments:
                values: [associational_not_causal]
