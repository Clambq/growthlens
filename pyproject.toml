[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "growthlens"
version = "0.1.0"
description = "A reproducible analytics portfolio for commerce monitoring and randomized experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hengyu Zhang" }]
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "sqlalchemy>=2.0,<3",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
analytics = [
  "dbt-duckdb>=1.9,<2",
  "duckdb-engine>=0.17,<1",
  "dbt-postgres>=1.9,<2",
  "jupyter>=1.1,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "reportlab>=4.2,<5",
]
dev = [
  "duckdb>=1.3,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
growthlens = "growthlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/growthlens"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/integration/test_commerce_metrics.py" = ["E501"]
"tests/integration/test_commerce_diagnostics.py" = ["E501"]
